<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Flux Academy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <header>
    <h1>Entrar na Flux Academy</h1>
    <div class="navbar">
      <a href="/">Voltar ao site</a>
      <a class="anon-only" href="/register.html">Ainda não tem conta? Registe-se</a>
      <button id="logout" class="ghost auth-only">Terminar sessão</button>
    </div>
  </header>
  <div class="container narrow">
    <div class="card">
      <h3>Login</h3>
      <form id="signin-form">
        <label>Email</label>
        <input type="email" name="email" required />
        <label>Password</label>
        <input type="password" name="password" required />
        <label class="checkbox-row">
          <input type="checkbox" name="terms" required />
          <span>Li e aceito os <a href="/terms.html" target="_blank">Termos e Condições</a></span>
        </label>
        <button type="submit">Entrar</button>
      </form>
    </div>
    <div class="card">
      <h3>Recuperação de senha</h3>
      <form id="forgot-form">
        <label>Email usado no cadastro</label>
        <input type="email" name="email" required />
        <button type="submit">Enviar token</button>
      </form>
      <form id="reset-form">
        <label>Token recebido</label>
        <input type="text" name="token" required />
        <label>Nova password</label>
        <input type="password" name="password" required />
        <button type="submit">Atualizar senha</button>
      </form>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
